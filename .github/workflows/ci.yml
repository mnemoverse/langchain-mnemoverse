name: ci

# The same gate release.yml runs before it builds: ruff, strict mypy and the
# unit tests, on every Python version pyproject.toml declares, plus one run
# against the lowest versions the dependency ranges allow. The unit tests run
# with the network switched off (pytest-socket); the live suite in
# tests/integration_tests is skipped here because no API key is set.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        deps: ["latest"]
        include:
          # The floor of every range in pyproject.toml that this package calls.
          - python-version: "3.11"
            deps: "lowest"
    name: test (${{ matrix.python-version }}, ${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin the lowest supported versions
        if: matrix.deps == 'lowest'
        run: pip install "langchain-core==1.4.7" "langchain==1.3.0" "mnemoverse==0.5.2"

      - name: Installed versions
        run: pip show langchain-core langchain langgraph langchain-tests mnemoverse | grep -E '^(Name|Version):'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: python -m pytest tests/unit_tests -q --disable-socket --allow-unix-socket

      - name: Live tests are skipped without a key
        run: python -m pytest tests/integration_tests -q
